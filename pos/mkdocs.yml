site_name: POS & Inventory Management System
site_description: Functional Requirements and Documentation for KD Agri Inc Suite POS System
site_author: KD Agri Inc Suite Development Team
site_url: https://kd-agri-inc-suite.github.io/kd-agri-inc-suite/

repo_name: kd-agri-inc-suite/pos
repo_url: https://github.com/kd-agri-inc-suite/kd-agri-inc-suite
edit_uri: edit/main/pos/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Functional Requirements: functional-requirements.md

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

extra:
  version: 1.0.0
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kd-agri-inc-suite

